<html lang="km">
<head>
<meta charset="UTF-8">

<title>Cafe រាំ - Digital Menu</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:"Khmer OS Siemreap",Arial,sans-serif;
    margin:0;
    padding:15px;
    color:#333;

    background:
        linear-gradient(
            rgba(0,0,0,0.5),
            rgba(0,0,0,0.5)
        ),
        url('Cafe Ram.png')
        no-repeat center center fixed;

    background-size:cover;
}

header{
    text-align:center;
    margin-bottom:15px;
    padding-top:10px;
}

header h1{
    margin:0 0 5px;
    font-size:34px;
    text-shadow:2px 2px 6px rgba(0,0,0,0.8);
    font-weight:bold;
}

header h1 .cafe-text{
    color:#f39c12;
}

header h1 .ram-text{
    color:#ffffff;
}

header p{
    color:#f1f1f1;
    margin:0;
    font-size:14px;
    font-weight:bold;
    text-shadow:1px 1px 3px rgba(0,0,0,0.8);
}

.container{
    max-width:900px;
    margin:auto;
}

/* ================= SEARCH ================= */

.search-box{
    margin-bottom:15px;
}

.search-box input{
    width:100%;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:25px;
    font-size:14px;
    font-family:inherit;
    outline:0;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
    background:rgba(255,255,255,0.95);
}

.search-box input:focus{
    border-color:#e67e22;
}

/* ================= TABS ================= */

.tab-container{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.tab-btn{
    padding:10px 25px;
    border:none;
    border-radius:25px;
    font-size:15px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
    background:rgba(255,255,255,0.9);
    color:#2c3e50;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    transition:.2s;
}

.tab-btn.active,
.tab-btn:hover{
    background:#e67e22;
    color:#fff;
}

/* ================= SECTION ================= */

.section-title{
    color:#2c3e50;
    border-left:4px solid #e67e22;
    padding-left:10px;
    margin:20px 0 15px;
    font-size:18px;

    background:rgba(255,255,255,0.85);

    padding-top:3px;
    padding-bottom:3px;

    border-radius:0 4px 4px 0;
}

/* ================= GRID ================= */

.items-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(160px,1fr));
    gap:15px;
}

/* ================= MENU ITEM ================= */

.menu-item{
    background:rgba(255,255,255,0.95);
    border:1px solid #eee;
    border-radius:12px;
    padding:10px;
    text-align:center;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    box-shadow:0 2px 8px rgba(0,0,0,.06);

    transition:.2s;
}

.menu-item:hover{
    transform:translateY(-3px);
    border-color:#e67e22;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.menu-item img{
    width:100%;
    height:120px;
    object-fit:contain;
    background:#fff;
    border-radius:8px;
}

.menu-item h3{
    font-size:14px;
    margin:8px 0 4px;
    color:#2c3e50;
}

/* ================= PRICE ================= */

.price-box{
    margin-bottom:4px;
}

.price-usd{
    color:#e74c3c;
    font-weight:bold;
    font-size:14px;
}

.price-riel{
    color:#27ae60;
    font-size:12px;
    font-weight:bold;
    margin-top:2px;
}

/* ================= FOOTER ================= */

footer{
    margin-top:40px;
    padding:20px 10px;

    background:rgba(255,255,255,0.95);

    border-radius:12px;

    box-shadow:0 2px 8px rgba(0,0,0,.06);

    text-align:center;
}

footer h3{
    font-size:16px;
    color:#2c3e50;
    margin-bottom:12px;
}

.social-links{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.social-links a{
    display:inline-block;

    padding:8px 15px;

    border-radius:20px;

    font-size:13px;

    text-decoration:none;

    color:#fff;

    font-weight:bold;

    transition:.2s;
}

.btn-fb{
    background:#1877f2;
}

.btn-tt{
    background:#000000;
}

.btn-tg{
    background:#0088cc;
}

.btn-map{
    background:#e74c3c;
}

.social-links a:hover{
    opacity:.85;
}

.footer-contact{
    font-size:13px;
    color:#666;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    body{
        padding:10px;
    }

    header h1{
        font-size:30px;
    }

    .items-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .menu-item{
        padding:7px;
    }

    .menu-item img{
        height:100px;
    }

    .menu-item h3{
        font-size:12px;
    }

    .price-usd{
        font-size:13px;
    }

    .price-riel{
        font-size:11px;
    }

    .tab-btn{
        padding:8px 15px;
        font-size:13px;
    }
}

</style>

/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   RENDER CUSTOMER MENU
   ===================================================== */

function renderCustomerMenu(list, gridId){

    const grid =
        document.getElementById(gridId);

    if(!grid){
        return;
    }


    grid.innerHTML = list.map(item => {

        const name = item[0];
        const price = item[1];
        const image = item[2];

        const riel =
            Math.round(price * 4000)
                .toLocaleString("en-US");


        return `

            <div
                class="menu-item"
                data-name="${escapeHtml(name)}"
            >

                <img
                    src="${image}"
                    alt="${escapeHtml(name)}"

                    onerror="
                        this.style.opacity='0.25';
                        this.title='Image not found: ${escapeHtml(image)}';
                    "
                >

                <h3>
                    ${escapeHtml(name)}
                </h3>

                <div class="price-box">

                    <div class="price-usd">
                        $${price.toFixed(2)}
                    </div>

                    <div class="price-riel">
                        ${riel} ៛
                    </div>

                </div>

            </div>

        `;

    }).join("");

}


/* =====================================================
   UPDATE MENU COUNTS
   ===================================================== */

function updateMenuCounts(){

    document.getElementById("drinksCount")
        .innerText =
        `(${drinks.length} មុខ)`;


    document.getElementById("foodsCount")
        .innerText =
        `(${foods.length} មុខ)`;

}


/* =====================================================
   SWITCH TAB
   ===================================================== */

function switchTab(category, button){

    document
        .querySelectorAll(".tab-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    const drinksSection =
        document.getElementById("drinksSection");

    const foodsSection =
        document.getElementById("foodsSection");


    if(category === "all"){

        drinksSection.style.display = "block";
        foodsSection.style.display = "block";

    }

    else if(category === "drinks"){

        drinksSection.style.display = "block";
        foodsSection.style.display = "none";

    }

    else if(category === "foods"){

        drinksSection.style.display = "none";
        foodsSection.style.display = "block";

    }


    /*
       Re-run search after switching tab
       so the search result remains correct.
    */

    filterMenu();

}


/* =====================================================
   SEARCH
   ===================================================== */

function filterMenu(){

    const input =
        document.getElementById("searchInput");

    const query =
        input.value
            .toLowerCase()
            .trim();


    document
        .querySelectorAll(".menu-item")
        .forEach(item => {

            const name =
                item.dataset.name || "";

            const text =
                item.innerText || "";


            const searchable =
                (
                    name + " " + text
                ).toLowerCase();


            if(searchable.includes(query)){

                item.style.display = "flex";

            }
            else{

                item.style.display = "none";

            }

        });

}


/* =====================================================
   INITIAL LOAD
   ===================================================== */

window.addEventListener("DOMContentLoaded", function(){

    renderCustomerMenu(
        drinks,
        "customerDrinksGrid"
    );


    renderCustomerMenu(
        foods,
        "customerFoodsGrid"
    );


    updateMenuCounts();

});

</script>
